<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cipta Guru — Program Tahunan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Bricolage+Grotesque:wght@700;800&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Plus Jakarta Sans',sans-serif;background:#F8F7FF;color:#0F172A;-webkit-font-smoothing:antialiased;min-height:100vh;}
.top{background:white;border-bottom:1px solid #E5E3F0;padding:12px 24px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;position:sticky;top:0;z-index:20;}
.back{font-size:.75rem;font-weight:700;color:#4F46E5;cursor:pointer;white-space:nowrap;}
.ctx{flex:1;min-width:220px;}
.ctx b{font-family:'Bricolage Grotesque',sans-serif;font-size:1rem;display:block;line-height:1.2;}
.ctx span{font-size:.7rem;color:#94a3b8;}
.seg{display:inline-flex;border:1.5px solid #E5E3F0;border-radius:11px;overflow:hidden;background:white;}
.seg button{border:none;background:none;padding:8px 16px;font:700 .76rem 'Plus Jakarta Sans';color:#64748B;cursor:pointer;}
.seg button.on{background:linear-gradient(135deg,#4F46E5,#7C3AED);color:white;}
.bar{max-width:1180px;margin:14px auto 0;padding:0 24px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
.btn{display:inline-flex;align-items:center;gap:7px;padding:9px 15px;border-radius:11px;border:1.5px solid #E5E3F0;background:white;font:700 .76rem 'Plus Jakarta Sans';color:#374151;cursor:pointer;transition:all .18s;}
.btn:hover{border-color:#818CF8;color:#4F46E5;background:#EEF2FF;}
.btn.pri{background:linear-gradient(135deg,#4F46E5,#7C3AED);color:white;border:none;box-shadow:0 4px 14px rgba(79,70,229,.35);}
.btn.pri:hover{color:white;transform:translateY(-1px);}
.btn.on{background:#ECFDF5;border-color:#10B981;color:#047857;}
.panel{max-width:1180px;margin:12px auto 0;padding:0 24px;}
.pbox{background:white;border:1px solid #E5E3F0;border-radius:14px;padding:12px 16px;display:flex;align-items:center;gap:18px;flex-wrap:wrap;font-size:.76rem;color:#475569;}
.pbox b{color:#0F172A;}
.pbox input[type=number]{width:62px;padding:6px 8px;border:1.5px solid #E5E3F0;border-radius:8px;font:700 .8rem 'Plus Jakarta Sans';}
.pbox .hint{flex-basis:100%;font-size:.68rem;color:#92400E;background:#FFFBEB;border:1px dashed #FDE68A;border-radius:8px;padding:6px 10px;}
.pbox .warn{flex-basis:100%;font-size:.7rem;color:#9F1239;background:#FFF1F2;border:1px solid #FECDD3;border-radius:8px;padding:6px 10px;}
.stage{padding:16px 24px 60px;display:flex;justify-content:center;overflow-x:auto;}
.sheet{width:794px;max-width:100%;background:white;box-shadow:0 10px 40px rgba(15,23,42,.12);padding:34px 36px;font-family:'Plus Jakarta Sans','Segoe UI',Calibri,Arial,sans-serif;font-size:10pt;line-height:1.5;color:#1E293B;border-radius:4px;min-height:300px;}
.sheet[contenteditable=true]{outline:3px dashed #10B981;outline-offset:6px;}
.kop{border-bottom:3px double #111;padding-bottom:10px;margin-bottom:12px;text-align:center;}
.kop .a{font-family:'Bricolage Grotesque','Plus Jakarta Sans',sans-serif;font-weight:800;font-size:14pt;letter-spacing:.3px;}
.kop .b{font-size:9.5pt;color:#475569;}
.doc-title{text-align:center;font-family:'Bricolage Grotesque','Plus Jakarta Sans',sans-serif;font-weight:800;font-size:13.5pt;margin:6px 0 2px;text-transform:uppercase;}
.doc-sub{text-align:center;font-size:11pt;margin-bottom:10px;}
.ident{width:100%;margin-bottom:10px;font-size:10pt;}
.ident td{padding:1px 4px;vertical-align:top;border:none;}
.ident td:first-child{width:150px;}
.ident td:nth-child(2){width:12px;}
table.data{width:100%;border-collapse:collapse;font-size:9pt;line-height:1.45;margin-bottom:12px;}
table.data th,table.data td{border:1px solid #94A3B8;padding:5px 6px;vertical-align:top;}
table.data th{background:#EEF2FF;text-align:center;font-weight:700;vertical-align:middle;}
table.data td.c{text-align:center;vertical-align:middle;}
table.data td.bab{background:#F1F5F9;font-weight:700;}
table.data td.wk{width:21px;min-width:21px;text-align:center;vertical-align:middle;padding:2px 0;}
table.data td.fill{background:#C7D2FE;font-weight:700;color:#312E81;}
table.data th.wst{cursor:pointer;user-select:none;font-size:6.5pt;padding:2px 0;}
table.data th.wst.l{background:#FEE2E2;color:#991B1B;}
table.data th.wst.u{background:#FEF3C7;color:#92400E;}
table.data td.off{background:repeating-linear-gradient(45deg,#fff,#fff 3px,#F1F5F9 3px,#F1F5F9 6px);}
table.data tr.tot td{font-weight:700;background:#F8FAFC;}
.ttd{display:flex;justify-content:space-between;margin-top:26px;font-size:10pt;text-align:center;}
.ttd div{width:40%;}
.ttd .sp{height:58px;}
.state{text-align:center;padding:60px 20px;color:#64748B;font-size:.9rem;line-height:1.7;}
.state b{display:block;font-size:1.05rem;color:#0F172A;margin-bottom:6px;}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(30px);background:#0F172A;color:white;padding:11px 20px;border-radius:12px;font-size:.78rem;font-weight:600;opacity:0;transition:all .3s;z-index:50;pointer-events:none;}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
.modal{position:fixed;inset:0;background:rgba(15,23,42,.55);display:none;align-items:center;justify-content:center;z-index:70;padding:16px;}
.modal.show{display:flex;}
.modal .card{background:white;border-radius:16px;padding:22px 22px 18px;width:460px;max-width:100%;max-height:92vh;overflow:auto;}
.modal h3{font:800 1.05rem 'Bricolage Grotesque';margin-bottom:4px;}
.modal p{font-size:.72rem;color:#64748B;margin-bottom:12px;line-height:1.5;}
.modal label{display:block;font-size:.68rem;font-weight:700;color:#475569;margin:10px 0 4px;}
.modal input{width:100%;padding:9px 11px;border:1.5px solid #E5E3F0;border-radius:10px;font:500 .82rem 'Plus Jakarta Sans';}
.modal .act{display:flex;gap:8px;justify-content:flex-end;margin-top:16px;}
@media (max-width:820px){.top{padding:10px 14px}.bar,.stage,.panel{padding-left:12px;padding-right:12px}}
@media print{
  @page{size:A4;margin:14mm;}
  body{background:white;}
  .top,.bar,.panel,.toast,.modal{display:none!important;}
  .stage{padding:0;display:block;overflow:visible;}
  .sheet{box-shadow:none;width:100%;padding:0;border-radius:0;outline:none!important;}
  table.data th.wst{cursor:default;}
}

td.smt{background:#C7D2FE;font-weight:800;color:#312E81;text-align:center;letter-spacing:.5px;}
table.data td.bab{background:#F1F5F9;font-weight:700;}
</style>
</head>
<body>
<div class="top">
  <a class="back" onclick="location.href=HALAMAN.selector+'?tujuan=prota'">← Ganti Materi</a>
  <a class="back" onclick="location.href=HALAMAN.dashboard">🏠 Dashboard</a>
  <div class="ctx"><b id="ctx-title">Memuat…</b><span id="ctx-sub">—</span></div>
</div>

<div class="bar">
  <button class="btn pri" onclick="unduh('pdf')">⬇ PDF / Cetak</button>
  <button class="btn" onclick="unduh('doc')">📄 Word</button>
  <button class="btn" onclick="unduh('xls')">📊 Excel</button>
  <button class="btn" id="b-edit" onclick="toggleEdit()">✏️ Edit</button>
  <button class="btn" onclick="bukaKop()">⚙️ Data Kop &amp; Tanda Tangan</button>
</div>
<div class="stage"><div class="sheet" id="sheet"><div class="state"><b>Memuat Prota…</b>Mengambil data dari server.</div></div></div>
<div class="toast" id="toast"></div>

<div class="modal" id="modal-kop">
  <div class="card">
    <h3>Data Kop &amp; Tanda Tangan</h3>
    <p>Diisi sekali, tersimpan di biodatamu, lalu otomatis dipakai di semua dokumen.</p>
    <label>Nama satuan pendidikan</label><input id="k-satuan" placeholder="contoh: PKBM Tanda Genap">
    <label>Alamat satuan pendidikan</label><input id="k-alamat" placeholder="contoh: Jl. Contoh No. 1, Jakarta">
    <label>Kota (untuk tanggal tanda tangan)</label><input id="k-kota" placeholder="contoh: Jakarta">
    <label>Nama kepala satuan (beserta gelar)</label><input id="k-kepala" placeholder="contoh: Nama Kepala, M.Pd.">
    <label>NIP kepala satuan (boleh dikosongkan)</label><input id="k-kepala-nip" placeholder="NIP">
    <div class="act"><button class="btn" onclick="tutupKop()">Batal</button><button class="btn pri" onclick="simpanKop()">Simpan</button></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
const _sb = (typeof supabase !== 'undefined')
  ? supabase.createClient('https://geabugomvgsgemlmxggx.supabase.co', 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImdlYWJ1Z29tdmdzZ2VtbG14Z2d4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODYwNzU1NTgsImV4cCI6MjEwMTY1MTU1OH0.1dReCnfV-u45mqo1__AD7NNwjRQUWuPzV3WX1RRliZE') : null;

const HALAMAN = {            // ← nama file halaman; ubah di sini kalau berganti
  index:     'index.html',
  biodata:   'biodata-v6.html',
  dashboard: 'dashboard-v3.html',
  selector:  'cptp-selector-v4.html',
};
if (localStorage.getItem('ciptaguru_logged_in') !== 'true' || !localStorage.getItem('ciptaguru_user_id')) location.href = HALAMAN.index;

const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const now = new Date();
const TH_MULAI = now.getMonth() + 1 >= 7 ? now.getFullYear() : now.getFullYear() - 1;
const TAHUN = `${TH_MULAI}/${TH_MULAI + 1}`;

let pilihan = {};
try { pilihan = JSON.parse(localStorage.getItem('ciptaguru_bab_pilihan') || '{}'); } catch (e) {}
let D = null, G = {}, edit = false;

function tampilPesan(judul, isi) { $('sheet').innerHTML = `<div class="state"><b>${esc(judul)}</b>${isi}</div>`; }
async function muat() {
  if (!pilihan.mapel_slug || !pilihan.kelas) {
    $('ctx-title').textContent = 'Belum ada materi dipilih';
    tampilPesan('Belum ada mata pelajaran dipilih', 'Pilih mapel dan kelas dulu.<br><br><button class="btn pri" onclick="location.href=HALAMAN.selector+\'?tujuan=prota\'">Pilih Materi →</button>');
    return;
  }
  if (!_sb) { tampilPesan('Koneksi gagal', 'Pustaka Supabase tidak termuat. Periksa internet lalu muat ulang.'); return; }
  const m = pilihan.mapel_slug, k = pilihan.kelas, uid = localStorage.getItem('ciptaguru_user_id');
  try {
    const [mk, tp, guru] = await Promise.all([
      _sb.from('mapel_kelas').select('*').eq('mapel_slug', m).eq('kelas', k).maybeSingle(),
      _sb.from('tp').select('*').eq('mapel_slug', m).eq('kelas', k).order('urutan'),
      _sb.from('teachers').select('*').eq('id', uid).maybeSingle(),
    ]);
    for (const r of [mk, tp]) if (r.error) throw r.error;
    if (!mk.data || !tp.data.length) {
      $('ctx-title').textContent = `${pilihan.mapel_nama || m} — Kelas ${k}`;
      tampilPesan('Konten belum tersedia', 'Materi untuk mapel dan kelas ini belum ditambahkan.<br><br><button class="btn pri" onclick="location.href=HALAMAN.selector+\'?tujuan=prota\'">← Pilih Materi Lain</button>');
      return;
    }
    D = { meta: mk.data, tp: tp.data };
    const g = (guru && guru.data) || {};
    const nama = [g.gelar_depan, g.nama_lengkap, g.gelar_belakang].filter(Boolean).join(' ').replace(/\s+,/g, ',') || localStorage.getItem('ciptaguru_teacher_name') || 'Nama Guru';
    G = { id: uid, nama, nip: g.nip || '', satuan: g.satuan_nama || '', alamat: g.satuan_alamat || '', kota: g.kota || '', kepala: g.kepala_nama || '', kepalaNip: g.kepala_nip || '' };
  } catch (err) {
    console.error(err);
    tampilPesan('Gagal memuat data', 'Terjadi kendala saat mengambil data. Periksa internet lalu muat ulang.<br><small>' + esc(err.message || '') + '</small>');
    return;
  }
  $('ctx-title').textContent = `Prota — ${D.meta.nama} Kelas ${D.meta.kelas}`;
  $('ctx-sub').textContent = `Paket ${D.meta.paket} · Fase ${D.meta.fase} · Tahun Ajaran ${TAHUN}`;
  document.title = `Cipta Guru — Prota ${D.meta.nama_pendek || D.meta.nama} Kelas ${D.meta.kelas}`;
  render();
}

const satuanNama = () => (G.satuan || ((pilihan.satuan || 'PKBM / SKB') + ' — NAMA SATUAN PENDIDIKAN')).toUpperCase();
const kop = () => `<div class="kop"><div class="a">${esc(satuanNama())}</div><div class="b">${esc(G.alamat || 'Alamat satuan pendidikan · Kota/Kabupaten')}</div></div>`;
const ttd = () => `<div class="ttd"><div>Mengetahui,<br>Kepala Satuan Pendidikan<div class="sp"></div><b>${esc(G.kepala || '(................................)')}</b>${G.kepalaNip ? '<br>NIP. ' + esc(G.kepalaNip) : ''}</div><div>${esc(G.kota || 'Kota')}, ........................ ${now.getFullYear()}<br>Guru Mata Pelajaran<div class="sp"></div><b>${esc(G.nama)}</b>${G.nip ? '<br>NIP. ' + esc(G.nip) : ''}</div></div>`;

function render() {
  if (!D) return;
  let no = 0, total = 0, body = '';
  [1, 2].forEach(s => {
    const rows = D.tp.filter(t => t.semester === s);
    if (!rows.length) return;
    body += `<tr><td class="smt" colspan="5">SEMESTER ${s}</td></tr>`;
    let bab = null, sub = 0;
    rows.forEach(t => {
      if (t.bab_no !== bab) {
        bab = t.bab_no;
        const jb = rows.filter(x => x.bab_no === bab).reduce((a, x) => a + (x.jp || 0), 0);
        body += `<tr><td class="bab" colspan="3">Bab ${t.bab_no}: ${esc(t.bab_judul)} <span style="font-weight:500">— ${esc(t.elemen)}</span></td><td class="bab c">${jb}</td><td class="bab"></td></tr>`;
      }
      no++; sub += t.jp || 0;
      body += `<tr><td class="c">${no}</td><td class="c">${esc(t.tp_kode)}</td><td>${esc(t.tp_teks)}</td><td class="c">${t.jp ?? ''}</td><td></td></tr>`;
    });
    total += sub;
    body += `<tr class="tot"><td colspan="3" style="text-align:right">Jumlah JP Semester ${s}</td><td class="c">${sub}</td><td></td></tr>`;
  });
  body += `<tr class="tot"><td colspan="3" style="text-align:right">JUMLAH JP SETAHUN</td><td class="c">${total}</td><td></td></tr>`;
  $('sheet').innerHTML = kop() +
    `<div class="doc-title">Program Tahunan (PROTA)</div><div class="doc-sub">Tahun Ajaran ${TAHUN}</div>
    <table class="ident"><tr><td>Mata Pelajaran</td><td>:</td><td>${esc(D.meta.nama)}</td></tr><tr><td>Kelas / Fase</td><td>:</td><td>${D.meta.kelas} / ${D.meta.fase} (Paket ${D.meta.paket})</td></tr><tr><td>Guru</td><td>:</td><td>${esc(G.nama)}</td></tr></table>
    <table class="data"><thead><tr><th style="width:30px">No</th><th style="width:52px">Kode TP</th><th>Tujuan Pembelajaran</th><th style="width:42px">JP</th><th style="width:90px">Keterangan</th></tr></thead><tbody>${body}</tbody></table>` + ttd();
}

function toast(m) { const t = $('toast'); t.textContent = m; t.classList.add('show'); setTimeout(() => t.classList.remove('show'), 2200); }
function namaBerkas(ext) { const mp = (D.meta.nama_pendek || D.meta.mapel_slug).replace(/[^\w]+/g, '_'); return `PROTA_${mp}_Kelas${D.meta.kelas}.${ext}`; }
function unduh(jenis) {
  if (!D) return;
  if (edit) toggleEdit();
  if (jenis === 'pdf') { toast('Di jendela cetak, pilih “Simpan sebagai PDF”'); setTimeout(() => window.print(), 400); return; }
  if (jenis === 'doc') {
    const html = `<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:w="urn:schemas-microsoft-com:office:word"><head><meta charset="utf-8"><style>body{font-family:Calibri,Arial,sans-serif;font-size:11pt}table.data{border-collapse:collapse;width:100%}table.data th,table.data td{border:1px solid #000;padding:4px;vertical-align:top}.kop{text-align:center;border-bottom:3px double #000}.doc-title{text-align:center;font-weight:bold}.doc-sub{text-align:center}td.smt{background:#C7D2FE;font-weight:bold}td.bab{background:#E2E8F0;font-weight:bold}</style></head><body>${$('sheet').innerHTML}</body></html>`;
    const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob(['\ufeff', html], {type:'application/msword'})); a.download = namaBerkas('doc'); a.click(); return;
  }
  if (jenis === 'xls') {
    if (typeof XLSX === 'undefined') { toast('Pustaka Excel gagal dimuat (cek internet)'); return; }
    const tbl = $('sheet').querySelector('table.data'); if (!tbl) return;
    XLSX.writeFile(XLSX.utils.table_to_book(tbl, {sheet: 'PROTA'}), namaBerkas('xlsx'));
  }
}
function toggleEdit() {
  if (!D) return;
  edit = !edit; $('sheet').contentEditable = edit; $('b-edit').classList.toggle('on', edit);
  $('b-edit').textContent = edit ? '✔ Selesai Edit' : '✏️ Edit';
  if (edit) toast('Klik teks di lembar untuk menyunting, lalu unduh');
}

// ── Data kop ─────────────────────────────────────
function bukaKop() {
  if (!D) return;
  $('k-satuan').value = G.satuan || ''; $('k-alamat').value = G.alamat || ''; $('k-kota').value = G.kota || '';
  $('k-kepala').value = G.kepala || ''; $('k-kepala-nip').value = G.kepalaNip || '';
  $('modal-kop').classList.add('show');
}
function tutupKop() { $('modal-kop').classList.remove('show'); }
async function simpanKop() {
  const v = id => $(id).value.trim() || null;
  const baru = { satuan_nama: v('k-satuan'), satuan_alamat: v('k-alamat'), kota: v('k-kota'), kepala_nama: v('k-kepala'), kepala_nip: v('k-kepala-nip') };
  try {
    if (!_sb) throw new Error('Tidak terhubung');
    const { error } = await _sb.from('teachers').update(baru).eq('id', G.id);
    if (error) throw error;
  } catch (e) { console.error(e); toast('Gagal menyimpan. Coba lagi.'); return; }
  Object.assign(G, { satuan: baru.satuan_nama || '', alamat: baru.satuan_alamat || '', kota: baru.kota || '', kepala: baru.kepala_nama || '', kepalaNip: baru.kepala_nip || '' });
  tutupKop(); render(); toast('Data kop tersimpan ✅');
}

muat();
</script>
</body>
</html>
